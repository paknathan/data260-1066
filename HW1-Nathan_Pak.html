
<form action="https://webhook.site" method="GET">
    <h1>Municipal transit incidents</h1>
    <input type="text" id="incident_id" name="incident_id" required autofocus
        placeholder="Enter the id of the incident (e.g., INC-00147)">
    <input type="text" id="route_or_line" name="route_or_line" required
        placeholder="Enter the affected route or line (e.g., Route 22, Blue Line)">
    <input type="text" id="email" name="email" required placeholder="Enter your email">
    <textarea id="description" name="description" required
            placeholder="Describe what happened (e.g., cause, impact on riders, actions taken)"></textarea>
    <select name="Incident Type" id="Incident Type">
        <option value = "Mechanical Breakdown">Mechanical Breakdown</option>
        <option value = "Collision">Collision</option>
        <option value = "Delay">Delay</option>
        <option value = "Route Detour">Route Detour</option>
    </select>

    <input type="checkbox" id="Acceptance" name="Terms & Conditions" value="yes">
    <label for="Acceptance">I agree to the terms and conditions.</label>

    <button type="submit">Submit</button>
    <script src="script.js"></script>
</form>

# HW9 Part 3.1 - labeled semantic-cache test set (s1066, municipal transit incidents).
#
# Protocol: the 10 `seeds` are answered by the HW8 agent pipeline and stored first; they are the
# ONLY cache entries during the sweep. Each of the 40 `cases` is then looked up against them.
#   expected: hit  -> the case must be served the answer of seed `seed`
#   expected: miss -> the case needs its own answer (serving any cached answer is a false hit)
# Labels were fixed before any threshold sweep was run. Do not relabel after seeing results:
# document any labeling mistake separately (see reports/hw09/METRICS.md).

seeds:
  - id: S01
    query: "A bus on Route 22 broke down at 1st and Santa Clara during the morning rush. What should riders do?"
  - id: S02
    query: "Why is the Blue Line light rail delayed at Tasman station?"
  - id: S03
    query: "How do I get a refund if my train was cancelled because of an incident?"
  - id: S04
    query: "What safety steps should passengers follow if a train stops between stations?"
  - id: S05
    query: "How does the transit agency decide the severity level of an incident?"
  - id: S06
    query: "Is the Orange Line running a bus bridge between Mountain View and Whisman after the power outage?"
  - id: S07
    query: "How do I report a suspicious package left on a bus?"
  - id: S08
    query: "Will my monthly pass be extended if service is suspended for more than three days?"
  - id: S09
    query: "Why are northbound trains skipping Convention Center station this morning?"
  - id: S10
    query: "What should wheelchair users do if the elevator at Diridon station is out of service?"


# HW8: Kafka (KRaft, single node) + incident worker + FastAPI wrapper on PORT_BASE 8166.
#   cd code && docker compose -f docker-compose.hw8.yml up -d --build
name: s1066-hw8
services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: s1066_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  worker:
    build: {context: ., dockerfile: kafka_service/Dockerfile}
    container_name: s1066_incident_worker
    command: ["python", "-m", "kafka_service.worker"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      FLOW_LOG: /app/reports_hw08/raw/kafka_flow.jsonl
    volumes:
      - ../reports/hw08:/app/reports_hw08
    depends_on:
      kafka: {condition: service_healthy}

  api:
    build: {context: ., dockerfile: kafka_service/Dockerfile}
    container_name: s1066_incident_api
    command: ["uvicorn", "kafka_service.api:app", "--host", "0.0.0.0", "--port", "8166"]
    ports:
      - "8166:8166"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      FLOW_LOG: /app/reports_hw08/raw/kafka_flow.jsonl
    volumes:
      - ../reports/hw08:/app/reports_hw08
    depends_on:
      kafka: {condition: service_healthy}
